name: Build LiteCast Android app

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > android/app/litecast.jks; echo "Using LiteCast signing key"; else echo "No KEYSTORE_B64 secret - using a temporary debug key"; fi

      - name: Build APK
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk LiteCast.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LiteCast-apk
          path: LiteCast.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: LiteCast for Android
          make_latest: true
          body: |
            Install on Android: download LiteCast.apk below, open it, and allow "Install unknown apps" when asked.
            Teachers: share your phone screen, go live and record. Students: join a class link and record it.
          files: LiteCast.apk
